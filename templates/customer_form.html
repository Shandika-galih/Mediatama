{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Tambah' }} Customer · VideoIzin{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ 'Edit' if customer else 'Tambah' }} Customer</h1><p class="muted">Akun customer digunakan untuk masuk dan mengajukan akses.</p></div></div>
<section class="card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="name">Nama</label><input id="name" name="name" required value="{{ customer.name if customer else '' }}">
    <label for="email">Email</label><input id="email" name="email" type="email" required value="{{ customer.email if customer else '' }}">
    <label for="password">Kata sandi {{ '(kosongkan jika tidak diubah)' if customer else '' }}</label>
    <input id="password" name="password" type="password" {% if not customer %}required minlength="8"{% else %}minlength="8"{% endif %}>
    <p class="muted">Minimal 8 karakter.</p>
    <div class="actions"><button type="submit">Simpan</button><a class="button secondary" href="{{ url_for('admin_customers') }}">Batal</a></div>
  </form>
</section>
{% endblock %}
