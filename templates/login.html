{% extends "base.html" %}
{% block title %}Masuk · VideoIzin{% endblock %}
{% block content %}
<section class="card">
  <h1>Masuk ke VideoIzin</h1>
  <p class="muted">Gunakan akun admin atau customer yang telah dibuat.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
    <label for="password">Kata sandi</label><input id="password" name="password" type="password" required>
    <p><button type="submit">Masuk</button></p>
  </form>
</section>
{% endblock %}
