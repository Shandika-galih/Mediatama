{% extends "base.html" %}
{% block title %}{{ video.title }} · VideoIzin{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ video.title }}</h1><p class="muted description">{{ video.description }}</p></div></div>
<section class="card">
  <video class="video-frame" controls preload="metadata">
    <source src="{{ url_for('serve_video', video_id=video.id) }}">
    Browser Anda tidak mendukung pemutar video HTML5.
  </video>
  <p class="muted">Akses berakhir {{ video.expires_at[:16].replace('T', ' ') }} UTC.</p>
  <a href="{{ url_for('customer_dashboard') }}">← Kembali ke katalog</a>
</section>
{% endblock %}
